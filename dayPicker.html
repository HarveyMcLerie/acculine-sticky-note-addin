<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Set Day Marker</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; padding: 16px; }
    h2 { font-size: 15px; margin-bottom: 12px; }
    .day-btn {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      text-align: left;
    }
    .day-btn:hover { background: #f3f3f3; }
    .dot { font-size: 18px; margin-right: 10px; }
    .clear-btn {
      margin-top: 8px;
      width: 100%;
      padding: 8px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      background: #fafafa;
      cursor: pointer;
      color: #555;
    }
    #status { margin-top: 12px; font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <h2>Set day marker for this email</h2>
  <div id="buttons"></div>
  <button class="clear-btn" id="clearBtn">Clear marker</button>
  <div id="status"></div>

  <script src="dayPicker.js"></script>
</body>
</html>
